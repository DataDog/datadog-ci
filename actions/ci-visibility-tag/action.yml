name: CI Visibility recorder
description: Record CI Visibility annotations locally and upload them after job cleanup
inputs:
  api-key:
    description: Datadog API key; defaults to DATADOG_API_KEY or DD_API_KEY at upload time
    required: false
  site:
    description: Datadog site; defaults to DATADOG_SITE, DD_SITE, or datadoghq.com
    required: false
  dry-run:
    description: Collect without sending HTTP requests or removing records
    default: 'false'
  upload-timeout-ms:
    description: Overall upload budget in milliseconds
    default: '10000'
runs:
  using: node24
  main: main.cjs
  post: post.cjs
  post-if: always()
